name: Mazal entity pilot

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Street names to test, one per line (no API keys)"
        type: string
        default: |
          משה מונטיפיורי
          מונטיפיורי משה
          שדרות משה מונטיפיורי
          חיים נחמן ביאליק
        required: true
      scan_pages:
        description: "Also sample names from structured HTML settlement pages"
        type: boolean
        default: false
      max_requests:
        description: "Maximum API requests and canonical names (1–500)"
        type: string
        default: "50"
        required: true

permissions:
  contents: read

concurrency:
  group: mazal-entity-pilot
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install lookup dependencies (no GIS or AI model needed)
        run: python -m pip install 'requests>=2.31,<3' 'pandas>=2,<3' 'numpy>=1.24,<3' 'rapidfuzz>=3,<4'
      - name: Test resolver without network or secrets
        run: python -m unittest discover -s tests -p 'test_mazal.py' -v
      - name: Restore lookup cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: cache/mazal/
          key: mazal-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mazal-v1-${{ github.ref_name }}-
      - name: Resolve names using repository secret
        env:
          MAZAL_API_KEY: ${{ secrets.MAZAL_API_KEY }}
          PILOT_NAMES: ${{ inputs.names }}
          SCAN_PAGES: ${{ inputs.scan_pages }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          if not os.environ.get("MAZAL_API_KEY", "").strip():
              sys.exit("Repository secret MAZAL_API_KEY is missing.")
          try:
              limit = int(os.environ["MAX_REQUESTS"])
              if not 1 <= limit <= 500:
                  raise ValueError
          except ValueError:
              sys.exit("max_requests must be an integer between 1 and 500.")
          args = [sys.executable, "scripts/build_mazal_entities.py",
                  "--max-requests", str(limit), "--max-names", str(limit)]
          for name in os.environ["PILOT_NAMES"].splitlines():
              if name.strip():
                  args += ["--name", name.strip()]
          if os.environ.get("SCAN_PAGES") == "true":
              args += ["--html-dir", "HTML"]
          sys.exit(subprocess.call(args))
          PY
      - name: Upload entity registry and review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mazal-entities-${{ github.run_id }}
          path: data/mazal_entities.json
          if-no-files-found: warn
          retention-days: 30
