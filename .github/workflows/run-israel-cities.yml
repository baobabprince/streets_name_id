name: Run Laya for 83 Israeli cities

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: israel-cities-batch
  cancel-in-progress: false

jobs:
  run-cities:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt "laya>=0.4.35,<0.5"

      - name: Run Laya for the 83 cities
        run: |
          python batch_process_settlements.py \
            --cities \
            --workers 1 \
            --use-ai \
            --local-ai-model laya \
            --no-gemini \
            --force

      - name: Verify that all cities completed
        if: success()
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          reports = list(Path("batch_reports").glob("batch_summary_*.json"))
          if not reports:
              print("No batch summary report was generated.", file=sys.stderr)
              sys.exit(1)

          report_path = max(reports, key=lambda path: path.stat().st_mtime)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          stats = report["statistics"]
          total = stats["total_settlements"]
          successful = stats["successful"]
          print(f"Processed {total} cities; {successful} pipelines succeeded.")

          if total != 83 or successful != 83:
              print(
                  f"Expected 83 successful city runs, got {successful}/{total}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Upload city results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: israel-cities-results-${{ github.run_id }}
          path: |
            batch_reports/
            HTML/
            data/diagnostic_report_*.csv
            data/step4_candidate_scores_*.csv
          if-no-files-found: warn
          retention-days: 90
